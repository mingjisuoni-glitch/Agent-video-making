name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: ruff check voice tools tests
      - run: python -m unittest discover -s tests -q
      - run: python -m tools.doctor --json > doctor.json
      - run: python -c "import json; payload=json.load(open('doctor.json', encoding='utf-8')); assert payload['ok'], payload"
      - run: python -m json.tool video.schema.json > /dev/null
      - run: python -m tools.preflight_video examples/video-plan.example.json --json

  hello-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/hello-video/package-lock.json
      - run: npm ci
        working-directory: examples/hello-video
      - run: npm run check
        working-directory: examples/hello-video
