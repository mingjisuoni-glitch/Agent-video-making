name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: ruff check voice tools tests
      - run: python -m unittest discover -s tests -q
      - run: python -m tools.fetch_skills --validate-only --json
      - run: python -m pip wheel --no-deps . -w dist
      - run: python -c "import glob,zipfile; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); required=['LICENSE','LICENSE.md','Apache-2.0.txt','PolyForm-Noncommercial-1.0.0.md','CC-BY-NC-4.0.txt','THIRD_PARTY_NOTICES.md']; missing=[item for item in required if not any(name.endswith(item) for name in names)]; assert not missing, missing"
      - run: python -m tools.doctor --json > doctor.json
      - run: python -c "import json; payload=json.load(open('doctor.json', encoding='utf-8')); assert payload['ok'], payload"
      - run: python -m json.tool video.schema.json > /dev/null
      - run: python -m tools.preflight_video examples/video-plan.example.json --json

  hello-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/hello-video/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: examples/hello-video
      - run: npm run check
        working-directory: examples/hello-video
      - run: npm run render
        working-directory: examples/hello-video
      - name: Verify rendered MP4 duration
        working-directory: examples/hello-video
        run: |
          test -s out/hello.mp4
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/hello.mp4)"
          python3 - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          assert abs(duration - 12.0) < 0.05, duration
          PY

  voiced-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: python -m pip install -e .
      - run: bash examples/voiced-demo/scripts/build.sh
